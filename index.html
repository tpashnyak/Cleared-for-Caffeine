<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cleared for Caffeine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a flight-deck pre-opening checklist. Game board on the left, a laminated yellow checklist card that fills as you play on the right. */
:root{
  --bg:#E8EDF0; --panel:#FFFFFF; --ink:#14202B; --muted:#4F5D6A; --line:#C3CDD5;
  --accent:#A84C0A; --accent-ink:#FFFFFF; --go:#1B6E3F; --alert:#A61F14; --warn:#8A5A00;
  --lam:#FFF1B8; --lam-ink:#2B2306; --lam-line:#D9C474;
  --soft:#F3F6F8; --focus:#1F5FBF; --coffee:#6B3B17;
  --f-display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body:"Atkinson Hyperlegible", Verdana, system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151B; --panel:#16212A; --ink:#E5ECF1; --muted:#A2B0BC; --line:#2C3A46;
  --accent:#F2A65A; --accent-ink:#1A0F04; --go:#5CD08F; --alert:#FF8576; --warn:#F2C35A;
  --lam:#2B2611; --lam-ink:#F6E7A8; --lam-line:#5A4E1E; --soft:#1C2933; --focus:#7FB2FF; --coffee:#B07A4A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151B; --panel:#16212A; --ink:#E5ECF1; --muted:#A2B0BC; --line:#2C3A46;
  --accent:#F2A65A; --accent-ink:#1A0F04; --go:#5CD08F; --alert:#FF8576; --warn:#F2C35A;
  --lam:#2B2611; --lam-ink:#F6E7A8; --lam-line:#5A4E1E; --soft:#1C2933; --focus:#7FB2FF; --coffee:#B07A4A; color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.01em;line-height:1;margin:0;text-wrap:balance}
h1{font-size:clamp(3rem,9vw,6.2rem);font-weight:900}
h2{font-size:clamp(2rem,5vw,2.9rem);font-weight:900}
h3{font-size:1.45rem;font-weight:700}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
button{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:.5em;border:2px solid var(--ink);background:var(--ink);color:var(--bg);padding:.7em 1.3em;border-radius:6px;font-weight:700;font-size:1rem}
.btn:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed;background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--soft);color:var(--ink);border-color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* top bar */
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding-bottom:14px;border-bottom:2px solid var(--ink);margin-bottom:24px}
.brand{font-family:var(--f-display);font-weight:900;font-size:1.5rem;text-transform:uppercase;letter-spacing:.02em}
.brand span{color:var(--accent)}
.steps{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.steps li{font-family:var(--f-mono);font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;padding:.35em .65em;border:1.5px solid var(--line);border-radius:4px;color:var(--muted)}
.steps li[aria-current="step"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.steps li.done{border-color:var(--go);color:var(--go)}

/* intro */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:40px;align-items:start}
.hero h1 span{color:var(--accent);display:block}
.lede{font-size:1.15rem;max-width:58ch;margin-top:18px}
.lede + .lede{margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:24px}
.stats div{background:var(--panel);padding:14px 16px}
.stats b{display:block;font-family:var(--f-mono);font-size:1.5rem;font-variant-numeric:tabular-nums}
.stats small{font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.how{margin-top:24px;padding:0;list-style:none;display:grid;gap:10px}
.how li{display:grid;grid-template-columns:2.2em 1fr;gap:8px;align-items:baseline}
.how li b.n{font-family:var(--f-mono);color:var(--accent)}

/* laminated checklist card */
.lam{background:var(--lam);color:var(--lam-ink);border-radius:10px;padding:18px 18px 16px;box-shadow:0 1px 0 var(--lam-line),0 10px 24px -14px rgba(0,0,0,.45);position:relative}
.lam::before{content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:70px;height:16px;border-radius:5px;background:var(--line);opacity:.9}
.lam-head{display:flex;justify-content:space-between;gap:8px;border-bottom:2px solid var(--lam-ink);padding-bottom:8px;margin-bottom:8px}
.lam-head h3{font-size:1.35rem}
.lam-head .mono{font-size:.72rem;align-self:end}
.cl{list-style:none;margin:0;padding:0;font-family:var(--f-mono);font-size:.82rem;text-transform:uppercase}
.cl li{display:flex;align-items:baseline;gap:6px;padding:5px 0;border-bottom:1px dashed var(--lam-line)}
.cl li .c{flex:0 1 auto;min-width:0}
.cl li .dots{flex:1 1 auto;border-bottom:2px dotted currentColor;opacity:.45;transform:translateY(-3px);min-width:12px}
.cl li .r{flex:0 0 auto;font-weight:600}
.cl li.empty{opacity:.5}
.cl li .num{width:1.6em;flex:0 0 auto;opacity:.7}
.lam-foot{margin-top:12px;display:grid;gap:8px}
.meter{height:10px;background:color-mix(in srgb,var(--lam-ink) 14%,transparent);border-radius:5px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--lam-ink);transition:width .25s}
.meter.over i{background:var(--alert)}
.lam-foot .row{justify-content:space-between;font-family:var(--f-mono);font-size:.78rem}

/* build round */
.board{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start;margin-top:20px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:grid;gap:14px}
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:12px;cursor:pointer;min-height:64px}
.task:hover{border-color:var(--ink)}
.task input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent)}
.task .lbl{min-width:0;line-height:1.35}
.task .cost{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);white-space:nowrap}
.task:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--panel))}
.task:has(input:disabled:not(:checked)){opacity:.55;cursor:not-allowed}
.intro-line{max-width:65ch;margin-top:10px}
.notice{font-family:var(--f-mono);font-size:.82rem;min-height:1.3em;color:var(--alert)}

/* cards for rounds */
.stage{max-width:820px;margin:20px auto 0;display:grid;gap:18px}
.panel{background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:22px}
.choices{display:grid;gap:10px}
.choice{text-align:left;background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;grid-template-columns:2em 1fr;gap:10px;align-items:start;line-height:1.4}
.choice:hover:not([disabled]){border-color:var(--ink)}
.choice .k{font-family:var(--f-mono);font-weight:600;color:var(--muted)}
.choice[disabled]{cursor:default}
.choice.right{border-color:var(--go);background:color-mix(in srgb,var(--go) 10%,var(--panel))}
.choice.wrong{border-color:var(--alert);background:color-mix(in srgb,var(--alert) 8%,var(--panel))}
.choice .tag{font-family:var(--f-mono);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;display:block;margin-top:4px}
.choice.right .tag{color:var(--go)} .choice.wrong .tag{color:var(--alert)}
.feedback{border-left:4px solid var(--accent);padding:10px 14px;background:var(--soft);border-radius:0 6px 6px 0}
.feedback b{display:block;margin-bottom:2px}
.principle{display:inline-block;font-family:var(--f-mono);font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;border:1.5px solid var(--accent);color:var(--accent);padding:.2em .55em;border-radius:4px;margin-top:8px}
.progress{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.alert-tag{display:inline-flex;gap:.6em;font-family:var(--f-mono);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;background:var(--alert);color:var(--panel);padding:.3em .7em;border-radius:4px;font-weight:600}
.saved{border:2px solid var(--go);background:color-mix(in srgb,var(--go) 10%,var(--panel));border-radius:8px;padding:14px 16px}
.saved b{color:var(--go)}

/* opening log */
.log{list-style:none;margin:0;padding:0;display:grid;gap:0;border-left:2px solid var(--line);margin-left:4.6em}
.log li{position:relative;padding:8px 0 8px 18px}
.log li .t{position:absolute;left:-5.2em;top:8px;font-family:var(--f-mono);font-size:.82rem;color:var(--muted);width:4.6em;text-align:right}
.log li::before{content:"";position:absolute;left:-7px;top:15px;width:12px;height:12px;border-radius:50%;background:var(--panel);border:2px solid var(--muted)}
.log li.good::before{background:var(--go);border-color:var(--go)}
.log li.bad::before{background:var(--alert);border-color:var(--alert)}
.log li.fun::before{background:var(--warn);border-color:var(--warn)}
.log li .st{font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;margin-right:.5em}
.log li.good .st{color:var(--go)} .log li.bad .st{color:var(--alert)} .log li.fun .st{color:var(--warn)}
.log li.hide{display:none}
@media (prefers-reduced-motion: no-preference){.log li.in{animation:pop .35s ease-out}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kpis div{background:var(--panel);padding:12px 14px}
.kpis b{display:block;font-family:var(--f-mono);font-size:1.35rem;font-variant-numeric:tabular-nums}
.kpis small{font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.neg{color:var(--alert)} .pos{color:var(--go)}

/* debrief */
.deb{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;margin-top:20px;align-items:start}
.scorebox{display:flex;flex-wrap:wrap;gap:20px;align-items:end}
.big{font-family:var(--f-display);font-weight:900;font-size:clamp(4.5rem,12vw,7rem);line-height:.85;color:var(--accent)}
.big small{font-size:.35em;color:var(--muted)}
.rank{font-family:var(--f-display);font-weight:700;font-size:1.7rem;text-transform:uppercase;line-height:1.05}
.bars{display:grid;gap:10px;margin-top:6px}
.bar{display:grid;grid-template-columns:minmax(0,11em) 1fr 4.2em;gap:10px;align-items:center;font-size:.92rem}
.bar .tr{height:12px;background:var(--soft);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--accent)}
.bar .v{font-family:var(--f-mono);text-align:right;font-size:.85rem}
.miss{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.miss li{border-left:4px solid var(--alert);padding:4px 0 4px 12px}
.miss li b{display:block}
.rules{counter-reset:r;list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rules li{counter-increment:r;display:grid;grid-template-columns:2em 1fr;gap:8px}
.rules li::before{content:counter(r);font-family:var(--f-mono);font-weight:600;color:var(--accent)}
.stack{display:grid;gap:16px}
.cl.spec li{text-transform:none;font-size:.8rem;display:block}
.cl.spec li .add{font-weight:600}
details{background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:14px 18px}
details summary{cursor:pointer;font-weight:700}
details h4{margin:14px 0 6px;font-family:var(--f-mono);font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent)}
details ul{margin:0;padding-left:1.2em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:860px){
  .hero,.board,.deb{grid-template-columns:minmax(0,1fr)}
  .side{position:static}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:480px){
  .bar{grid-template-columns:minmax(0,1fr) 3.6em}
  .bar .tr{grid-column:1 / -1;grid-row:2}
  .log{margin-left:0;border-left:0}
  .log li{padding-left:0}
  .log li::before{display:none}
  .log li .t{position:static;display:inline;text-align:left;margin-right:.5em}
}

/* ---- graphics & motion ---- */
.art{display:block;width:100%;height:auto;max-width:100%;border-radius:10px;overflow:hidden}
.art .sky{fill:var(--soft)} .art .ground{fill:var(--line)}
.art .ink{fill:var(--ink)} .art .acc{fill:var(--accent)} .art .panelF{fill:var(--panel)} .art .alertF{fill:var(--alert)}
.art .box{fill:var(--panel);stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.art .lamBox{fill:var(--lam);stroke:var(--ink);stroke-width:3}
.art .boxSm{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.art .inkS{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.art .mutedS{fill:none;stroke:var(--muted);stroke-width:2.5;stroke-linecap:round}
.art .goS{fill:none;stroke:var(--go);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.art text{font-family:var(--f-mono);font-weight:600}
.art .txt{fill:var(--ink)} .art .txtInv{fill:var(--accent-ink)} .art .txtM{fill:var(--muted)}
.art .spinner{fill:none;stroke:var(--accent);stroke-width:4;stroke-dasharray:50 26;stroke-linecap:round}
.art .cust{fill:var(--muted);opacity:.45;transition:fill .3s,opacity .3s}
.art .cust.on{fill:var(--go);opacity:1}
.art .track{fill:none;stroke:var(--line);stroke-width:14;stroke-linecap:round}
.art .fillArc{fill:none;stroke:var(--accent);stroke-width:14;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)}
.gauge{width:210px;flex:0 0 auto;border-radius:0}
#needle{transform-origin:110px 112px;transition:transform 1.4s cubic-bezier(.2,.8,.2,1)}
#sun{transition:transform .85s ease-in-out}
.hero-art{margin-bottom:18px}
.scene{max-width:440px;margin:0 auto 16px}
.stamp{position:absolute;top:18px;right:18px;font-family:var(--f-display);font-weight:900;text-transform:uppercase;font-size:1.6rem;letter-spacing:.04em;color:var(--go);border:4px solid var(--go);padding:.05em .45em;border-radius:6px;transform:rotate(-8deg);background:color-mix(in srgb,var(--panel) 85%,transparent)}
.panel{position:relative}
.tick{color:var(--go);font-weight:700;margin-right:3px}
.cupg{display:flex;align-items:end;gap:8px}
.cupg svg{width:28px;height:34px;flex:0 0 auto}
.cupg .liq{fill:var(--coffee);transition:transform .6s cubic-bezier(.3,1.4,.5,1)}
.cupg .cupo{fill:none;stroke:var(--lam-ink);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.bean{position:fixed;width:10px;height:14px;margin:-7px 0 0 -5px;border-radius:50%;background:var(--coffee);pointer-events:none;z-index:60}
.bean::after{content:"";position:absolute;left:4px;top:2px;width:2px;height:10px;border-radius:2px;background:color-mix(in srgb,var(--coffee) 45%,#000)}
.bean.ck{background:none;width:16px;height:16px;color:var(--go);font-weight:700;font-size:18px;line-height:16px}
.bean.ck::after{display:none}
@media (prefers-reduced-motion: no-preference){
  .fly{animation:fly 15s linear infinite}
  .steam path{transform-box:fill-box;animation:steam 2.6s ease-in-out infinite}
  .steam path:nth-child(2){animation-delay:.8s} .steam path:nth-child(3){animation-delay:1.6s}
  .draw{stroke-dasharray:20;animation:draw 7s ease-out infinite both}
  .draw.d1{animation-delay:.6s} .draw.d2{animation-delay:1.2s} .draw.d3{animation-delay:1.8s}
  .spin{transform-box:fill-box;transform-origin:center;animation:spin 1s linear infinite}
  .cardslide{animation:slide 2.4s ease-in-out infinite}
  .buzz{transform-box:fill-box;transform-origin:center;animation:buzz 1.6s ease-in-out infinite}
  .sag{transform-box:fill-box;transform-origin:right bottom;animation:sag 1.8s ease-out both}
  .puff{animation:puff 2s ease-out infinite}
  .alert-tag{animation:pulse 1.6s ease-out infinite}
  .stamp{animation:stampIn .5s cubic-bezier(.2,1.6,.4,1) .25s both}
  .cl li.just{animation:rowIn .9s ease-out}
  .cl li.just .r{display:inline-block;animation:stampIn .45s cubic-bezier(.2,1.6,.4,1) .05s both}
  .shake{animation:shake .45s}
  .cust.hop{animation:hop .45s ease-out}
  .jolt{animation:shake .45s}
  .rank{animation:stampIn .5s cubic-bezier(.2,1.6,.4,1) 1.3s both}
}
@keyframes fly{from{transform:translateX(-270px)}to{transform:translateX(530px)}}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-14px)}}
@keyframes draw{0%,4%{stroke-dashoffset:20;opacity:1}14%,86%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(-26px)}}
@keyframes buzz{0%,40%,100%{transform:rotate(0)}5%,15%,25%,35%{transform:rotate(-5deg)}10%,20%,30%{transform:rotate(5deg)}}
@keyframes sag{0%{transform:rotate(0)}60%{transform:rotate(4deg)}100%{transform:rotate(3deg)}}
@keyframes puff{0%{opacity:0;transform:translateX(0)}30%{opacity:1}100%{opacity:0;transform:translateX(18px)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--alert) 55%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
@keyframes stampIn{from{transform:scale(2.2) rotate(-14deg);opacity:0}to{opacity:1}}
@keyframes rowIn{from{background:color-mix(in srgb,var(--accent) 35%,transparent)}to{background:transparent}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes hop{50%{transform:translateY(-7px)}}
@media (prefers-reduced-motion: reduce){.fillArc,#needle,#sun,.cupg .liq{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">Cleared for <span>Caffeine</span></div>
    <ol class="steps" id="steps" aria-label="Game rounds"></ol>
  </header>
  <main id="main"></main>
  <div class="sr" aria-live="polite" id="live"></div>
</div>

<script>
const BUDGET = 500, SLOTS = 10, CROWD = 120, PRICE = 4.5;

const TASKS = [
  {id:"cups", label:"Buy cups, lids & sleeves", ch:"Cups, lids, sleeves", rs:"Stocked", cost:60, kind:"critical",
   why:"No cups means a very expensive coffee-scented waiting room.", spec:"Buy 150 cups (12 oz), lids & sleeves. Count them. Owner: ____ · by 6 PM tonight"},
  {id:"supplier", label:"Confirm bean & milk delivery time with the supplier", ch:"Supplier delivery", rs:"Confirmed", cost:0, kind:"critical",
   why:"A delivery you assumed is a delivery you don't have.", spec:"Call supplier: 10 lb beans + 4 gal milk on site by 5:30 AM. Get a name. Owner: ____"},

const REDUCE = matchMedia("(prefers-reduced-motion: reduce)");
function burst(el,n=16,checks=false){
  if(REDUCE.matches||!el)return;
  const r=el.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  for(let i=0;i<n;i++){
    const b=document.createElement("span"); const ck=checks&&i%3===0;
    b.className="bean"+(ck?" ck":""); if(ck)b.textContent="✓";
    b.setAttribute("aria-hidden","true"); b.style.left=cx+"px"; b.style.top=cy+"px";
    document.body.appendChild(b);
    const a=Math.random()*Math.PI*2, d=60+Math.random()*100, dx=Math.cos(a)*d, dy=Math.sin(a)*d-40;
    b.animate([{transform:"translate(0,0) rotate(0deg) scale(.6)",opacity:1},
               {transform:`translate(${dx}px,${dy+80}px) rotate(${Math.random()*540-270}deg) scale(1)`,opacity:0}],
              {duration:900+Math.random()*500,easing:"cubic-bezier(.15,.7,.3,1)"}).onfinish=()=>b.remove();
  }
}

    if(e.target.checked){
      if(S.picks.size>=SLOTS){e.target.checked=false;$("#notice").textContent="All 10 slots are full. Remove something first.";return}
      if(committed()+t.cost>BUDGET){e.target.checked=false;$("#notice").textContent=`Over budget. That would put you at ${fmt(committed()+t.cost)}.`;return}
      S.picks.add(id); S.just=id;
    } else {S.picks.delete(id); S.just=null;}
    $("#notice").textContent="";
    refresh();
    say(`${S.picks.size} of 10 slots used. ${fmt(committed())} committed.`);
  });
  $("#lock").onclick=()=>{S.craft=CRAFT.map(c=>({...c,goodFirst:Math.random()<.5}));S.ci=0;S.cAnswered=false;go("craft")};
  refresh();
  function refresh(){
    $("#card").innerHTML=checklistCard();
    const f=S.picks.size/SLOTS, liq=$("#card .liq");
    requestAnimationFrame(()=>requestAnimationFrame(()=>{liq.style.transform=`translateY(${26*(1-f)}px)`}));
    S.fill=f;
    const full=S.picks.size===SLOTS;
    if(full&&S.just) setTimeout(()=>burst($("#lock"),18,true),300);
    $("#lock").disabled=!full;
    box.querySelectorAll("input").forEach(i=>{i.disabled=!i.checked&&full});
  }
}

/* ---------- CRAFT ---------- */
function craft(){
  const c=S.craft[S.ci];
  const opts=c.goodFirst?[[c.good,true],[c.bad,false]]:[[c.bad,false],[c.good,true]];
  main.innerHTML = `<div class="stage">
    <div><p class="eyebrow">Round 2 of 4 · Checklist boot camp</p><h2>Which one belongs on a real checklist?</h2></div>
    <p class="progress">Item ${S.ci+1} of ${S.craft.length} · Score so far: ${S.craft.filter(x=>x.ok).length}</p>
    <div class="choices" id="ch">${opts.map(([txt,g],i)=>`<button class="choice" data-g="${g}"><span class="k">${"AB"[i]}</span><span>${esc(txt)}<span class="tag"></span></span></button>`).join("")}</div>
    <div id="fb"></div>
  </div>`;
  $("#ch").addEventListener("click",e=>{
    const b=e.target.closest(".choice"); if(!b||b.disabled)return;
    const ok=b.dataset.g==="true"; c.ok=ok;
    if(ok) burst(b,16); else b.classList.add("shake");
    $("#ch").querySelectorAll(".choice").forEach(x=>{x.disabled=true;
      if(x.dataset.g==="true"){x.classList.add("right");x.querySelector(".tag").textContent="Checklist-worthy"}
      else if(x===b){x.classList.add("wrong");x.querySelector(".tag").textContent="Not quite"}});
    const last=S.ci===S.craft.length-1;
    $("#fb").innerHTML=`<div class="feedback"><b>${ok?"Correct.":"Not this time."}</b>${esc(c.fb)}<br><span class="principle">${esc(c.p)}</span></div>
      <div class="row" style="margin-top:14px"><button class="btn" id="next">${last?"Head into the morning →":"Next item →"}</button></div>`;
    say((ok?"Correct. ":"Not quite. ")+c.fb);
    $("#next").focus();
    $("#next").onclick=()=>{ if(last){S.ti=0;go("twist")} else {S.ci++;craft();$("h2").focus()} };
  });
}

/* ---------- TWIST ---------- */
function twist(){
  const tw=TWISTS[S.ti]; const last=S.ti===TWISTS.length-1;
  const covered=S.picks.has(tw.cover);
  main.innerHTML = `<div class="stage">
    <div><p class="eyebrow">Round 3 of 4 · Turbulence · ${S.ti+1} of ${TWISTS.length}</p><h2>${esc(tw.title)}</h2></div>
    <div class="panel">${SCENES[tw.id]}${covered?'<div class="stamp" aria-hidden="true">Saved</div>':''}<span class="alert-tag"><span>Alert</span><span>${tw.time} AM</span></span>
      <p style="margin-top:12px;font-size:1.1rem">${esc(tw.text)}</p></div>
    <div id="act"></div><div id="fb"></div>
  </div>`;
  const next=()=>{ if(last) go("open"); else {S.ti++;twist();$("h2").focus()} };
  const nextBtn=`<div class="row" style="margin-top:14px"><button class="btn" id="next">${last?"Open the doors →":"Next problem →"}</button></div>`;
  if(covered){
    S.twist[tw.id]={q:"covered"};
    $("#act").innerHTML=`<div class="saved"><b>Your checklist caught this.</b> Item on your list: <strong>${esc(T[tw.cover].label)}</strong>.<p style="margin-top:6px">${esc(tw.coverMsg)}</p></div>${nextBtn}`;
    say("Your checklist caught this. "+tw.coverMsg);
    setTimeout(()=>burst($(".stamp"),16,true),550);
    $("#next").onclick=next; return;
  }
  const opts=shuffle(tw.opts);
  $("#act").innerHTML=`<p class="muted" style="margin-bottom:10px">Nothing on your checklist covers this. What do you do?</p>
    <div class="choices" id="ch">${opts.map((o,i)=>`<button class="choice" data-i="${i}"><span class="k">${"ABC"[i]}</span><span>${esc(o.t)}<span class="tag"></span></span></button>`).join("")}</div>`;
  $("#ch").addEventListener("click",e=>{
    const b=e.target.closest(".choice"); if(!b||b.disabled)return;
    const o=opts[+b.dataset.i]; S.twist[tw.id]={q:o.q,cost:o.cost||0,r:o.r};
    if(o.q==="good") burst(b,14); else b.classList.add("shake");
    $("#ch").querySelectorAll(".choice").forEach(x=>{x.disabled=true;
      const oo=opts[+x.dataset.i];
      if(oo.q==="good"){x.classList.add("right");x.querySelector(".tag").textContent="Best recovery"}
      else if(x===b){x.classList.add("wrong");x.querySelector(".tag").textContent=oo.q==="ok"?"Survivable":"Ouch"}});
    const label={good:"Solid recovery.",ok:"You survived.",bad:"That went about how you'd expect."}[o.q];
    $("#fb").innerHTML=`<div class="feedback"><b>${label}</b>${esc(o.r)}<br><span class="muted">Prevention would have been cheaper: <strong>${esc(T[tw.cover].label)}</strong> (${T[tw.cover].cost?fmt(T[tw.cover].cost):"free"}).</span></div>${nextBtn}`;
    say(label+" "+o.r);
    $("#next").focus(); $("#next").onclick=next;
  });
}

/* ---------- SIMULATION ---------- */
function simulate(){
  const has=id=>S.picks.has(id);
  let served=CROWD, happy=80; const log=[];
  const add=(t,k,txt)=>log.push({t,k,txt});
  // twists
  const tw=S.twist; let extra=0;
  const twEff={covered:[0,5],good:[-6,0],ok:[-25,-6],bad:[-45,-20]};
  for(const id of ["supplier","shift","reader"]){const r=tw[id]||{q:"bad"};const e=twEff[r.q];served+=e[0];happy+=e[1];extra+=r.cost||0}
  add("05:12", tw.supplier.q==="covered"?"good":tw.supplier.q==="good"?"good":"bad",
      tw.supplier.q==="covered"?"Supplier runs late. Backup beans save the day.":"Supplier runs late. "+tw.supplier.r);
  add("05:48", tw.shift.q==="covered"||tw.shift.q==="good"?"good":"bad",
      tw.shift.q==="covered"?"Opener calls in sick. Backup opener arrives at 6:00 with the key.":"Opener calls in sick. "+tw.shift.r);
  if(!has("shift")) add("05:50","bad","Nobody confirmed the shift, so you found out by text, not by plan.");
  if(has("power")) add("06:00","good","Outlet is right where you measured. Cord reaches with room to spare.");
  else {served-=10; add("06:00","bad","Your extension cord is four feet short. Two people hold the espresso machine up near the outlet for 20 minutes.");}
  if(has("equipment")) add("06:10","good","Espresso machine hits 200°F on the first try. Last night's test run paid off.");
  else {served-=15; happy-=5; add("06:10","bad","The grinder makes a noise like a lawnmower eating a spoon. 25-minute delay.");}
  add("06:31", tw.reader.q==="covered"||tw.reader.q==="good"?"good":"bad",
      tw.reader.q==="covered"?"Card reader fails. Cash float and QR sign keep the line moving.":"Card reader fails. "+tw.reader.r);
  if(has("logo")) add("06:45","fun","The holographic logo flickers majestically. It cost more than everything else combined.");
  if(has("name")) add("06:50","fun","The espresso machine is officially named Sir Brews-a-Lot. It does not care.");
  if(has("latteart")) add("06:55","fun","Your latte swans are breathtaking. You can make one every four minutes.");
  if(has("latteart")) served-=15;
  if(has("cups")) add("07:00","good","Doors open. 150 cups, lids, and sleeves are stacked and ready.");
  else {served=Math.round(served*0.15); happy-=30; add("07:02","bad","First customer orders a latte. You have no cups. You offer to pour it into their hands. They decline. Congratulations, you run a coffee-scented waiting room.");}
  if(!has("menu")){served=Math.round(served*0.85); add("07:10","bad","Every customer asks \"How much?\" The line moves 30% slower.");}
  else add("07:10","good","Prices are posted. Customers order before they reach the counter.");
  if(has("milk")) add("07:20","good","Lattes flying out. The cooler reads 38°F.");
  else {served-=10; happy-=15; add("07:20","bad","No milk. Every latte becomes a \"deconstructed latte,\" which is black coffee with confidence.");}
  if(has("influencer")) add("07:25","fun","The influencer films 47 seconds of content. It's mostly you looking for something.");
  if(!has("permit")){served=Math.round(served*0.55); happy-=10;
    add("07:40","bad", has("mission")?"Campus security asks for your vendor permit. You hand them a 40-page mission statement. You're closed by 8:15.":"Campus security asks for your vendor permit. You don't have one. You're closed by 8:15.");}
  else if(has("mission")) add("07:40","fun","Nobody has read the 40-page mission statement. Nobody will.");
  if(!has("napkins")){happy-=8; add("08:15","bad","A spill. Then another. Someone uses your menu board as a napkin.");}
  if(!has("clean")){happy-=8; add("08:40","bad","Sticky counter, no sanitizer. A customer photographs it.");}
  if(has("mariachi")){happy+=10; add("09:00","fun","The mariachi band arrives. Customers love it. Your budget does not.");}
  served=Math.max(0,Math.min(CROWD,Math.round(served))); happy=Math.max(0,Math.min(100,happy));
  const revenue=served*PRICE, cost=spent()+extra, profit=revenue-cost;
  add("10:00", profit>0?"good":"bad", `Doors close. ${served} customers served, ${fmt(revenue)} in sales.`);
  log.sort((a,b)=>a.t.localeCompare(b.t));
  return {log,served,happy,revenue,cost,profit};
}

function open(){
  const R=S.result=simulate();
  main.innerHTML=`<div class="stage">
    <div><p class="eyebrow">Round 4 of 4 · Opening morning</p><h2>Doors open at 7:00</h2></div>
    ${OPEN_SCENE}
    <ol class="log" id="log">${R.log.map(l=>`<li class="${l.k} hide"><span class="t">${l.t}</span><span class="st">${{good:"OK",bad:"Problem",fun:"Hmm"}[l.k]}</span>${esc(l.txt)}</li>`).join("")}</ol>
    <div class="row"><button class="btn ghost" id="skip">Show the whole morning</button></div>
    <div id="kp" hidden></div>
  </div>`;
  const items=[...main.querySelectorAll("#log li")]; let i=0, timer;
  const reduce=REDUCE.matches;
  const sun=$("#sun"), clock=$("#clock"), sv=$("#servedTxt"), cart=$("#cart"), flash=$("#flash");
  const custs=[...main.querySelectorAll(".cust")];
  const paint=k=>{
    const p=k/items.length;
    sun.style.transform=`translate(${40+p*560}px,${150-Math.sin(p*Math.PI)*120}px)`;
    if(k>0) clock.textContent=R.log[k-1].t+" AM";
    const so=Math.round(R.served*p); sv.textContent="SERVED "+so;
    const n=Math.round(so/8);
    custs.forEach((c,j)=>{ if(j<n){ if(!c.classList.contains("on")) c.classList.add("on","hop") } else c.classList.remove("on","hop") });
    const ev=R.log[k-1];
    if(ev&&ev.k==="bad"&&!reduce){ flash.animate([{opacity:.3},{opacity:0}],{duration:650}); cart.classList.remove("jolt"); cart.getBoundingClientRect(); cart.classList.add("jolt"); }
  };
  paint(0);
  const done=()=>{
    clearInterval(timer); items.forEach(x=>x.classList.remove("hide")); paint(items.length);
    $("#skip").parentElement.hidden=true;
    const kp=$("#kp"); kp.hidden=false;
    kp.innerHTML=`<div class="kpis">
      <div><b>${R.served}</b><small>Customers</small></div>
      <div><b>${fmt(R.revenue)}</b><small>Sales</small></div>
      <div><b>${fmt(R.cost)}</b><small>Costs</small></div>
      <div><b class="${R.profit<0?'neg':'pos'}">${R.profit<0?"−":""}${fmt(Math.abs(R.profit))}</b><small>Profit</small></div>
      <div><b>${R.happy}%</b><small>Happiness</small></div></div>
      <div class="row" style="margin-top:16px"><button class="btn" id="deb">See your debrief →</button></div>`;
    say(`Morning complete. ${R.served} customers served, profit ${fmt(R.profit)}.`);
    $("#deb").onclick=()=>go("debrief");
  };
  $("#skip").onclick=done;
  if(reduce){done();return}
  const step=()=>{ if(i>=items.length){done();return} items[i].classList.remove("hide"); items[i].classList.add("in"); i++; paint(i); };
  step(); timer=setInterval(step,1100);
}

/* ---------- DEBRIEF ---------- */
function debrief(){
  const R=S.result;
  const crit=CRITICAL.filter(id=>S.picks.has(id)).length;
  const coverage=Math.round(crit/CRITICAL.length*40);
  const craftPts=S.craft.filter(c=>c.ok).length*4;
  const twPts=Object.values(S.twist).reduce((s,r)=>s+({covered:10,good:8,ok:4,bad:0}[r.q]),0);
  const decoys=[...S.picks].filter(id=>T[id].kind==="decoy");
  const disc=Math.max(0,10-Math.round(decoys.length*2.5));
  const total=coverage+craftPts+twPts+disc;
  const rank= total>=90?"Captain of Caffeine": total>=75?"First Officer of Foam": total>=55?"Co-Pilot in Training": total>=35?"Ground Crew, Probationary":"Manager, Coffee-Scented Waiting Room";
  const missed=TASKS.filter(t=>(t.kind==="critical"||t.kind==="contingency")&&!S.picks.has(t.id));
  const keep=[...S.picks].filter(id=>T[id].kind!=="decoy");
  const adds=missed.filter(t=>t.kind==="critical").map(t=>t.id);
  const upgraded=[...keep.map(id=>({t:T[id],add:false})),...adds.map(id=>({t:T[id],add:true}))];
  const bar=(name,v,max)=>`<div class="bar"><span>${name}</span><span class="tr" role="img" aria-label="${v} of ${max}"><i style="width:${v/max*100}%"></i></span><span class="v">${v}/${max}</span></div>`;
  main.innerHTML=`
  <p class="eyebrow">Debrief · Post-flight review</p>
  <h2>Your checklist report</h2>
  <div class="deb">
    <div class="stack">
      <div class="panel">
        <div class="scorebox">
          <svg class="art gauge" viewBox="0 0 220 128" role="img" aria-label="Score gauge reading ${total} out of 100">
            <path d="M20 112 A90 90 0 0 1 200 112" class="track"/>
            <path d="M20 112 A90 90 0 0 1 200 112" class="fillArc" pathLength="100"/>
            ${[0,25,50,75,100].map(v=>{const a=Math.PI-v/100*Math.PI;return `<text x="${(110+Math.cos(a)*68).toFixed(1)}" y="${(115-Math.sin(a)*68).toFixed(1)}" font-size="10" text-anchor="middle" class="txtM">${v}</text>`}).join("")}
            <g id="needle" style="transform:rotate(-90deg)"><line x1="110" y1="112" x2="110" y2="36" class="inkS"/><circle cx="110" cy="112" r="7" class="ink"/></g>
          </svg>
          <div><div class="big"><span id="scoreN">${REDUCE.matches?total:0}</span><small>/100</small></div><p class="eyebrow" style="margin-top:10px">Rank</p><p class="rank">${rank}</p></div>
        </div>
        <div class="bars" style="margin-top:18px">
          ${bar("Critical coverage",coverage,40)}
          ${bar("Checklist craft",craftPts,20)}
          ${bar("Crisis handling",twPts,30)}
          ${bar("Trap avoidance",disc,10)}
        </div>
        <p class="muted" style="margin-top:12px;font-size:.92rem">You covered ${crit} of ${CRITICAL.length} critical tasks${decoys.length?` and spent ${decoys.length} slot${decoys.length>1?"s":""} on trap${decoys.length>1?"s":""}`:" and avoided every trap"}. Morning result: ${R.served} customers, ${R.profit<0?"a loss of "+fmt(-R.profit):fmt(R.profit)+" profit"}.</p>
      </div>
      ${missed.length?`<div class="panel"><h3>What your checklist missed</h3><ul class="miss" style="margin-top:12px">${missed.map(t=>`<li><b>${esc(t.label)}</b><span class="muted">${t.kind==="contingency"?"Contingency · ":"Critical · "}${esc(t.why)}</span></li>`).join("")}</ul></div>`:`<div class="saved"><b>Nothing critical missed.</b> Your checklist covered every essential and every backup plan.</div>`}
      ${decoys.length?`<div class="panel"><h3>Traps you fell for</h3><ul class="miss" style="margin-top:12px">${decoys.map(id=>`<li style="border-color:var(--warn)"><b>${esc(T[id].label)}</b><span class="muted">${esc(T[id].why)}</span></li>`).join("")}</ul></div>`:""}
      <div class="panel"><h3>Six rules of a good checklist</h3>
        <ol class="rules" style="margin-top:12px">
          <li><span><strong>Killer items only.</strong> List the steps that are easy to forget and costly to miss. Skip the obvious.</span></li>
          <li><span><strong>Be specific and measurable.</strong> "Machine reads 200°F" can be checked. "Everything good" can't.</span></li>
          <li><span><strong>Give every item an owner and a deadline.</strong> "Someone" never shows up.</span></li>
          <li><span><strong>Plan for failure.</strong> Pair each critical item with a backup: beans, cash, people.</span></li>
          <li><span><strong>Use it every time.</strong> Experts skip steps because they feel confident. That's how Model 299 crashed.</span></li>
          <li><span><strong>Update it after every mistake.</strong> A checklist is a record of what your business has learned.</span></li>
        </ol>
      </div>
    </div>
    <div class="stack">
      <div class="lam">
        <div class="lam-head"><h3>Upgraded checklist</h3><span class="mono">REV 2</span></div>
        <ol class="cl spec">${upgraded.map((u,i)=>`<li><span class="num">${String(i+1).padStart(2,"0")}</span> ${u.add?'<span class="add">[ADDED] </span>':""}${esc(u.t.spec)}</li>`).join("")}</ol>
        <div class="row" style="margin-top:12px"><button class="btn" id="copy">Copy checklist</button><span class="mono" id="copied" role="status" style="font-size:.8rem"></span></div>
      </div>
      <details open><summary>Class discussion: the peer swap</summary>
        <ul style="margin-top:10px">
          <li>Trade checklists with another team. Find one critical item they missed.</li>
          <li>Which items on your list <em>prevent</em> problems, and which ones help you <em>recover</em> from them?</li>
          <li>Which trap was most tempting, and why do businesses overspend on branding before operations?</li>
          <li>Pick a business you know (a restaurant, a store, your job). What's one item that belongs on its opening checklist?</li>
        </ul>
      </details>
      <details><summary>For teachers</summary>
        <h4>Warm Up</h4>
        <p>Ask: "What's one thing you forgot this week that a checklist would have caught?" Collect three answers before starting the game.</p>
        <h4>Learning goals</h4>
        <p>By the end of this lesson, you will learn:</p>
        <ul>
          <li>how checklists support operations management, quality control, and risk management</li>
          <li>the difference between preventive tasks and contingency plans</li>
          <li>how to write specific, measurable checklist items with owners and deadlines</li>
          <li>how to prioritize resources under a fixed budget</li>
        </ul>
        <h4>Extension</h4>
        <p>Have teams build a closing checklist for the same pop-up, then swap and audit.</p>
      </details>
      <div class="row"><button class="btn ghost" id="again">Play again</button></div>
    </div>
  </div>`;
  const arc=main.querySelector(".fillArc"), nd=$("#needle"), sn=$("#scoreN");
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ arc.style.strokeDashoffset=100-total; nd.style.transform=`rotate(${-90+total*1.8}deg)`; }));
  if(!REDUCE.matches){
    const t0=performance.now();
    const tick=now=>{ const p=Math.min(1,(now-t0)/1400); sn.textContent=Math.round(total*(1-Math.pow(1-p,3)));
      if(p<1) requestAnimationFrame(tick); else if(total>=75) burst(sn,30,true); };
    requestAnimationFrame(tick);
  }
  const text="PRE-OPENING CHECKLIST · POP-UP COFFEE (REV 2)\n"+upgraded.map((u,i)=>`☐ ${i+1}. ${u.add?"[ADDED] ":""}${u.t.spec}`).join("\n");
  $("#copy").onclick=()=>{
    const ok=()=>{$("#copied").textContent="Copied."};
    try{navigator.clipboard.writeText(text).then(ok).catch(fallback)}catch(e){fallback()}
    function fallback(){const ta=document.createElement("textarea");ta.value=text;ta.setAttribute("aria-label","Checklist text");ta.style.cssText="width:100%;height:160px;margin-top:10px;font-family:var(--f-mono);font-size:.8rem";$("#copy").parentElement.after(ta);ta.select();$("#copied").textContent="Text selected. Press Ctrl+C or Cmd+C."}
  };
  $("#again").onclick=()=>{S.picks=new Set();S.twist={};S.fill=0;S.just=null;go("intro")};
  say(`Final score ${total} out of 100. Rank: ${rank}.`);
}

go("intro");
</script>
